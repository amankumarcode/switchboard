# Retail banking customer support.
# Intent names match Banking77 labels. Examples are sampled from the Banking77
# train split by scripts/prepare_data.py (seed 7); the eval set uses the test split.

domain: retail_banking
version: "0.1"
handlers_module: switchboard.handlers.banking

intents:
  - name: card_arrival
    description: >-
      The customer ordered a new or replacement card and is asking where it is,
      when it will be delivered, or how to track it. The card has not been received yet.
    examples:
      - "How can I track my card's delivery?"
      - "I haven't received my card and am worried it is lost."
      - "I have not received my card and it's been a week, what do I do?"
    handler: card_delivery_status
    risk: low

  - name: activate_my_card
    description: >-
      The customer has received their card and wants to activate it or is having
      trouble activating it.
    examples:
      - "I just got my new card, how do I activate it?"
      - "Activate my card"
      - "How can I make my card ready to use?"
    handler: card_activation
    risk: low

  - name: lost_or_stolen_card
    description: >-
      The customer no longer has their physical card because it was lost or stolen
      and wants to report it or block it.
    examples:
      - "My card was stolen"
      - "Who can I speak with regarding a lost card?"
      - "Is there any way for you to find my card?"
    handler: card_block
    risk: high

  - name: compromised_card
    description: >-
      The customer still has their card but believes its details were exposed or
      misused (fraud, skimming, data breach, unknown transactions they suspect are
      fraudulent) and wants it secured or replaced.
    examples:
      - "I think someone else is using my card."
      - "What do I do if I think someone has used my card without permission? I can see a few transactions I don't recognize."
      - "I think that someone may be using my card, but I'm not sure,."
    handler: card_block
    risk: high

  - name: change_pin
    description: >-
      The customer wants to change or reset their card PIN.
    examples:
      - "I need to make my card PIN a different number"
      - "If I want to select a new PIN what do I do?"
      - "Can you tell me where  can change my PIN?"
    handler: pin_change
    risk: low

  - name: cancel_transfer
    description: >-
      The customer wants to stop, cancel or reverse a bank transfer they initiated.
    examples:
      - "How do I fix a transaction to the wrong account?"
      - "I made a mistake and performed a transaction on the wrong account!"
      - "I made a transaction to the wrong account!"
    handler: transfer_cancellation
    risk: high

  - name: refund_not_showing_up
    description: >-
      The customer was promised a refund by a merchant but it has not appeared in
      their account yet.
    examples:
      - "I asked for a refund but its not here yet"
      - "I'm supposed to be getting a refund but it hasn't shown up, now what?"
      - "Did I not get my refund? I don't see it."
    handler: refund_status
    risk: low

  - name: card_payment_fee_charged
    description: >-
      The customer was charged an unexpected fee on a card payment and wants to
      know why.
    examples:
      - "I paid with card and was charged a fee that shouldn't be there!"
      - "How can I check how much free spending I have left? I have some big purchases coming up and want to know where I can look for any info."
      - "I'm being charged for using my card!"
    handler: fee_explanation
    risk: low

out_of_scope:
  description: >-
    The query does not match any intent above: other banking topics, unrelated
    requests, chit-chat, or messages too vague to classify.
  handler: human_queue

policy:
  # Eval (Haiku 5.5, prompt 2dbfad9e): auto-handling at >= medium was wrong 11.8% of
  # the time vs 2.3% at high, for 52% vs 42% of traffic automated. Precision wins.
  min_confidence: high
  human_review_risks: [high]

# LLM settings; each can be overridden with a SWITCHBOARD_* env variable.
model:
  name: claude-haiku-5-5
  max_tokens: 300
  effort: low
  thinking: false
  # temperature is only sent when api_version pins an older API version that
  # accepts sampling parameters (the current version rejects them on every model).
  temperature: null
  api_version: null
  timeout_s: 10
  max_retries: 2
  pricing:  # USD per million tokens, Anthropic first-party rates
    input_per_mtok: 0.10
    output_per_mtok: 0.50
