[project]
name = "switchboard"
version = "0.1.0"
description = "Config-driven LLM intent router: classify, apply policy, dispatch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "pydantic>=2",
    "pyyaml",
    "scikit-learn>=1.9.1",
    "uvicorn",
]

[project.scripts]
switchboard = "switchboard.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
